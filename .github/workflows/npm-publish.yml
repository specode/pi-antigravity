# Publish through npm Trusted Publishing (OIDC), never a long-lived npm token.
# Configure this repository/workflow in npm before the first authorized release.
name: Node.js Package

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      publishable: ${{ steps.package.outputs.publishable }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check publication eligibility
        id: package
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `publishable=${manifest.private !== true}\n`);
          if (manifest.private === true) console.log('Publication disabled: package.json remains private.');
          JS

  publish-npm:
    needs: validate
    if: needs.validate.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm publish --access public
